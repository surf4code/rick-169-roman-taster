name: Render on push (render-request.json)

on:
  push:
    paths:
      - "render-request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      expected_chunks: ${{ steps.split.outputs.expected_chunks }}
      composition: ${{ steps.split.outputs.composition }}
    steps:
      - uses: actions/checkout@v4
      - id: split
        run: |
          python3 - << 'EOF'
          import json, math, os
          r = json.load(open("render-request.json"))
          total = int(r["total_frames"]); chunks = min(40, max(1, int(r.get("chunks", 40))))
          off = int(r.get("start_frame", 0))
          step = math.ceil(total / chunks); items = []
          for i in range(chunks):
              s = i * step; e = min(total - 1, (i + 1) * step - 1)
              if s <= e: items.append({"idx": f"{i:02d}", "start": off + s, "end": off + e})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": items}) + "\n")
              fh.write(f"expected_chunks={len(items)}\n")
              fh.write("composition=" + r["composition"] + "\n")
          EOF

  render_chunk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (npm ci with lockfile; fallback to npm install)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json missing; running npm install."
            npm install --no-audit --no-fund
          fi
      - name: Ensure Remotion headless browser
        run: npx remotion browser ensure
      - name: Render frames ${{ matrix.start }}-${{ matrix.end }}
        run: |
          mkdir -p out/chunks
          START_TS=$(python3 -c 'import time; print(time.time())')
          npx remotion render src/index.ts "${{ needs.plan.outputs.composition }}"             "out/chunks/part_${{ matrix.idx }}.mp4"             --frames="${{ matrix.start }}-${{ matrix.end }}"             --codec=h264 --crf=14 --pixel-format=yuv420p             --gl=swangle --concurrency=2 --timeout=120000 --muted
          python3 - << EOF
          import json, time
          elapsed = time.time() - float("${START_TS}")
          frames = int("${{ matrix.end }}") - int("${{ matrix.start }}") + 1
          spf = elapsed / max(frames, 1)
          print(f"CHUNK ${{ matrix.idx }} | {frames} frames in {elapsed:.2f}s -> {spf:.3f} sec/frame")
          json.dump({"idx": "${{ matrix.idx }}", "frames": frames, "elapsed_sec": round(elapsed, 3), "sec_per_frame": round(spf, 4)}, open("out/chunks/timing_${{ matrix.idx }}.json", "w"))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: |
            studio/out/chunks/part_${{ matrix.idx }}.mp4
            studio/out/chunks/timing_${{ matrix.idx }}.json

  stitch_and_qa:
    needs: [plan, render_chunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: chunks
      - name: Install ffmpeg
        run: |
          which ffmpeg || (sudo apt-get update -y && sudo apt-get install -y ffmpeg)
      - name: Concat chunks, mux -14 LUFS audio, and output benchmark JSON
        run: |
          mkdir -p out/qa
          python3 - << 'EOF'
          import glob, json, os, sys
          parts = sorted(glob.glob("chunks/part_*.mp4"))
          expected = int("${{ needs.plan.outputs.expected_chunks }}")
          if len(parts) != expected:
              sys.exit(f"ERROR: Expected {expected} chunks, found {len(parts)}")
          with open("list.txt", "w") as fh:
              for p in parts:
                  fh.write(f"file '{os.path.abspath(p)}'\n")
          timings = [json.load(open(t)) for t in sorted(glob.glob("chunks/timing_*.json"))]
          tot_f = sum(t["frames"] for t in timings)
          tot_s = sum(t["elapsed_sec"] for t in timings)
          max_s = max((t["elapsed_sec"] for t in timings), default=0.0)
          summary = {
              "chunks": len(parts),
              "total_frames": tot_f,
              "avg_sec_per_frame": round(tot_s / max(tot_f, 1), 4),
              "slowest_chunk_sec": round(max_s, 2),
              "aggregate_compute_sec": round(tot_s, 2),
          }
          json.dump(summary, open("out/qa/render_benchmark.json", "w"), indent=2)
          print("RENDER BENCHMARK:", json.dumps(summary, indent=2))
          EOF
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy out/silent.mp4
          VOICE="studio/public/audio/voice.wav"
          if [ -f "$VOICE" ]; then
            ffmpeg -y -i out/silent.mp4 -i "$VOICE"               -map 0:v:0 -map 1:a:0 -c:v copy               -af "loudnorm=I=-14:TP=-1.5:LRA=11" -c:a aac -b:a 192k               -shortest out/final.mp4
          else
            cp out/silent.mp4 out/final.mp4
          fi
          ffmpeg -y -i out/final.mp4 -vf fps=30 -c:v libx264 -crf 14 -preset veryfast -pix_fmt yuv420p -c:a copy out/final_30fps.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: final-video-and-qa
          path: |
            out/final.mp4
            out/final_30fps.mp4
            out/qa/
