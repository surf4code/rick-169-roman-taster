name: Render rick-169 Video (Parallel Matrix)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition ID (StyleTestOpening or MainVideo)"
        default: "StyleTestOpening"
      total_frames:
        description: "Total frames (2250 for 75s StyleTest, 37800 for 21m @30fps)"
        default: "2250"
        required: true
      chunks:
        description: "Parallel jobs (max 40)"
        default: "40"
      studio_dir:
        description: "Directory containing package.json ('.' or 'studio')"
        default: "studio"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      expected_chunks: ${{ steps.split.outputs.expected_chunks }}
    steps:
      - id: split
        run: |
          python3 - << 'EOF'
          import json, math, os
          total = int("${{ inputs.total_frames }}")
          chunks = min(40, max(1, int("${{ inputs.chunks }}")))
          step = math.ceil(total / chunks)
          items = []
          for i in range(chunks):
              s = i * step
              e = min(total - 1, (i + 1) * step - 1)
              if s <= e:
                  items.append({"idx": f"{i:02d}", "start": s, "end": e})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": items}) + "\n")
              fh.write(f"expected_chunks={len(items)}\n")
          EOF

  render_chunk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.studio_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (npm ci with lockfile; fallback to npm install if missing)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json missing; running npm install. Commit package-lock.json for deterministic CI builds."
            npm install --no-audit --no-fund
          fi
      - name: Ensure Remotion headless browser
        run: npx remotion browser ensure
      - name: Render frames ${{ matrix.start }}-${{ matrix.end }} and measure seconds/frame
        run: |
          mkdir -p out/chunks
          T0=$(date +%s.%N)
          npx remotion render src/index.ts "${{ inputs.composition }}"             "out/chunks/part_${{ matrix.idx }}.mp4"             --frames="${{ matrix.start }}-${{ matrix.end }}"             --codec=h264 --crf=18 --pixel-format=yuv420p             --gl=swangle --concurrency=2 --muted
          T1=$(date +%s.%N)
          FRAMES=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          python3 -c "dt = $T1 - $T0; print(f'CHUNK ${{ matrix.idx }} | {dt:.2f}s for $FRAMES frames -> {dt/$FRAMES:.3f} sec/frame')" | tee "out/chunks/timing_${{ matrix.idx }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: |
            ${{ inputs.studio_dir }}/out/chunks/part_${{ matrix.idx }}.mp4
            ${{ inputs.studio_dir }}/out/chunks/timing_${{ matrix.idx }}.txt

  stitch_and_qa:
    needs: [plan, render_chunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: chunks
      - name: Verify chunk count, concat, mux -14 LUFS audio, and summarize render speed
        run: |
          mkdir -p out/qa
          ACTUAL=$(ls -1 chunks/part_*.mp4 | wc -l)
          EXPECTED=${{ needs.plan.outputs.expected_chunks }}
          echo "Downloaded chunks: $ACTUAL / $EXPECTED"
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::Chunk count mismatch ($ACTUAL != $EXPECTED)"
            exit 1
          fi
          cat chunks/timing_*.txt | sort | tee out/qa/render_timings.txt
          ls chunks/part_*.mp4 | sort | awk '{print "file \x27" $0 "\x27"}' > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy out/silent.mp4
          VOICE="${{ inputs.studio_dir }}/public/audio/voice.wav"
          if [ -f "$VOICE" ]; then
            ffmpeg -y -i out/silent.mp4 -i "$VOICE"               -map 0:v:0 -map 1:a:0 -c:v copy               -af "loudnorm=I=-14:TP=-1.5:LRA=11" -c:a aac -b:a 192k               -shortest out/final.mp4
          else
            cp out/silent.mp4 out/final.mp4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: final-video-and-qa
          path: |
            out/final.mp4
            out/qa/
