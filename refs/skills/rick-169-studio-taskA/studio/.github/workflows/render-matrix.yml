name: Render rick-169 Video (Parallel Matrix)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition ID (StyleTestOpening or MainVideo)"
        default: "StyleTestOpening"
      total_frames:
        description: "Total frames (2250 for 75s StyleTest, 37800 for 21m @30fps)"
        default: "2250"
        required: true
      chunks:
        description: "Parallel jobs (max 40)"
        default: "40"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      expected_chunks: ${{ steps.split.outputs.expected_chunks }}
    steps:
      - id: split
        run: |
          python3 - << 'EOF'
          import json, math, os
          total = int("${{ inputs.total_frames }}")
          chunks = min(40, max(1, int("${{ inputs.chunks }}")))
          step = math.ceil(total / chunks)
          items = []
          for i in range(chunks):
              s = i * step
              e = min(total - 1, (i + 1) * step - 1)
              if s <= e:
                  items.append({"idx": f"{i:02d}", "start": s, "end": e})
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("matrix=" + json.dumps({"include": items}) + "
")
              fh.write(f"expected_chunks={len(items)}
")
          EOF

  render_chunk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies (strict npm ci if package-lock.json exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json missing! Commit it via 'npm install --package-lock-only'. Falling back to npm install."
            npm install --no-audit --no-fund
          fi
      - name: Ensure Remotion Headless Chrome
        run: npx remotion browser ensure
      - name: Render frames ${{ matrix.start }}-${{ matrix.end }} with speed telemetry
        run: |
          mkdir -p out/chunks
          START_TS=$(python3 -c 'import time; print(time.time())')
          npx remotion render src/index.ts "${{ inputs.composition }}"             "out/chunks/part_${{ matrix.idx }}.mp4"             --frames="${{ matrix.start }}-${{ matrix.end }}"             --codec=h264 --crf=18 --pixel-format=yuv420p             --gl=swangle --concurrency=2 --timeout=120000 --muted
          python3 - << EOF
          import json, time
          elapsed = time.time() - float("${START_TS}")
          frames = int("${{ matrix.end }}") - int("${{ matrix.start }}") + 1
          spf = elapsed / max(frames, 1)
          print(f"CHUNK ${{ matrix.idx }} | {frames} frames in {elapsed:.2f}s -> {spf:.3f} seconds/frame")
          with open("out/chunks/timing_${{ matrix.idx }}.json", "w") as fh:
              json.dump({"idx": "${{ matrix.idx }}", "frames": frames, "elapsed_sec": round(elapsed, 3), "sec_per_frame": round(spf, 4)}, fh)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.idx }}
          path: |
            out/chunks/part_${{ matrix.idx }}.mp4
            out/chunks/timing_${{ matrix.idx }}.json

  stitch_and_qa:
    needs: [plan, render_chunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: chunks
      - name: Verify chunk count, concat, mux -14 LUFS audio, and report seconds/frame
        run: |
          mkdir -p out/qa
          python3 - << 'EOF'
          import glob, json, os, sys
          parts = sorted(glob.glob("chunks/part_*.mp4"))
          expected = int("${{ needs.plan.outputs.expected_chunks }}")
          if len(parts) != expected:
              sys.exit(f"ERROR: Expected {expected} chunks, found {len(parts)}")
          with open("list.txt", "w") as fh:
              for p in parts:
                  fh.write(f"file '{os.path.abspath(p)}'
")
          timings = [json.load(open(t)) for t in sorted(glob.glob("chunks/timing_*.json"))]
          tot_frames = sum(t["frames"] for t in timings)
          tot_cpu_sec = sum(t["elapsed_sec"] for t in timings)
          max_chunk_sec = max((t["elapsed_sec"] for t in timings), default=0.0)
          avg_spf = tot_cpu_sec / max(tot_frames, 1)
          summary = {
              "chunks": len(parts),
              "total_frames": tot_frames,
              "avg_sec_per_frame": round(avg_spf, 4),
              "slowest_chunk_sec": round(max_chunk_sec, 2),
              "aggregate_compute_sec": round(tot_cpu_sec, 2),
          }
          json.dump(summary, open("out/qa/render_benchmark.json", "w"), indent=2)
          print("RENDER TELEMETRY:", json.dumps(summary, indent=2))
          EOF
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy out/silent.mp4
          if [ -f public/audio/voice.wav ]; then
            ffmpeg -y -i out/silent.mp4 -i public/audio/voice.wav               -map 0:v:0 -map 1:a:0 -c:v copy               -af "loudnorm=I=-14:TP=-1.5:LRA=11" -c:a aac -b:a 192k               -shortest out/final.mp4
          else
            cp out/silent.mp4 out/final.mp4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: final-video-and-qa
          path: |
            out/final.mp4
            out/qa/
